[project]
name = "cs194w-backend"
version = "0.1.0"
description = "Legal discovery prototype — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "anthropic>=0.40",
  "neo4j>=5.24",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "pdfplumber>=0.11",
  "mail-parser>=3.15",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
groq = ["groq>=0.9"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "testcontainers[neo4j,postgres]>=4.8",
  "respx>=0.21",
  "groq>=0.9",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: hits the real Anthropic API (costs money)",
  "integration: requires docker-compose services",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
